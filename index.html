<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pedidos Handball</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap">
<style>
:root{--bg:#EEF3FA;--card:#fff;--ink:#10223F;--muted:#5A6B85;--line:#D4DEEC;--blue:#1F5FBF;--ball:#F26B1D;--ok:#1B8A4B;--on:#fff;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#0C1626;--card:#14233B;--ink:#E8EFFA;--muted:#93A6C4;--line:#243857;--blue:#5B9BFF;--ball:#FF8A47;--ok:#4FD58A;--on:#08111F}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Barlow,system-ui,sans-serif}
h1,h2,h3,.big,.tab{font-family:"Barlow Condensed",Barlow,system-ui,sans-serif;letter-spacing:.01em}
header{background:var(--blue);color:#fff;padding:14px 16px 0;border-bottom:6px solid var(--ball)}
@media (prefers-color-scheme:dark){header{color:#08111F}}
header h1{margin:0 0 10px;font-size:1.9rem;font-weight:800;text-transform:uppercase}
.tabs{display:flex;gap:6px;max-width:1000px;margin:0 auto}
.tab{flex:1;background:transparent;border:0;color:inherit;opacity:.75;padding:10px 6px;font-size:1.15rem;font-weight:700;cursor:pointer;border-radius:10px 10px 0 0;text-transform:uppercase}
.tab[aria-selected=true]{background:var(--bg);color:var(--ink);opacity:1}
main{max-width:1000px;margin:0 auto;padding:16px}
.layout{display:grid;grid-template-columns:1fr 360px;gap:18px;align-items:start}
@media (max-width:860px){.layout{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.menu{display:flex;align-items:center;gap:12px;justify-content:space-between}
.menu h3{margin:0;font-size:1.5rem;font-weight:700}
.menu p{margin:0;color:var(--muted);font-size:.95rem}
.price{font-weight:600}
.badge{display:inline-block;background:var(--ball);color:#fff;font:800 .95rem "Barlow Condensed",sans-serif;padding:2px 9px;border-radius:99px;margin-left:8px;vertical-align:3px;text-transform:uppercase}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:48px;height:48px;border-radius:50%;border:2px solid var(--blue);background:transparent;color:var(--blue);font-size:1.7rem;line-height:1;cursor:pointer}
.stepper b{min-width:30px;text-align:center;font:800 1.9rem "Barlow Condensed",sans-serif}
label{display:block;color:var(--muted);font-size:.9rem;margin-bottom:4px}
input[type=text],input[type=number]{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 14px}
.chip{flex:1;min-width:90px;padding:10px;border-radius:10px;border:2px solid var(--line);background:transparent;color:var(--ink);font:600 1rem Barlow,sans-serif;cursor:pointer}
.chip[aria-pressed=true]{border-color:var(--blue);background:var(--blue);color:var(--on)}
.line{display:flex;justify-content:space-between;padding:4px 0}
.disc{color:var(--ok);font-weight:600}
.total{border-top:2px solid var(--line);margin-top:8px;padding-top:10px;font:800 2rem "Barlow Condensed",sans-serif}
.cta{width:100%;margin-top:12px;background:var(--ball);color:#fff;border:0;border-radius:12px;padding:16px;font:800 1.4rem "Barlow Condensed",sans-serif;text-transform:uppercase;cursor:pointer}
.cta:disabled{opacity:.4;cursor:not-allowed}
.ghost{background:transparent;color:var(--blue);border:2px solid var(--blue);border-radius:10px;padding:9px 14px;font:600 .95rem Barlow,sans-serif;cursor:pointer}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat .big{font-size:2rem;font-weight:800;line-height:1.1}
.stat span{color:var(--muted);font-size:.85rem}
.ord{display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.ord h3{margin:0;font-size:1.4rem}
.ord small{color:var(--muted)}
.st{border:0;border-radius:99px;padding:8px 14px;font:700 .95rem Barlow,sans-serif;cursor:pointer}
.st.p{background:var(--ball);color:#fff}.st.d{background:var(--ok);color:var(--on)}
.del{background:none;border:0;color:var(--muted);font-size:1.3rem;cursor:pointer}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.set{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.set .full{grid-column:1/-1}
button:focus-visible,input:focus-visible{outline:3px solid var(--ball);outline-offset:2px}
.bank{background:var(--bg);border:1px dashed var(--blue);border-radius:12px;padding:12px;margin-bottom:12px}.bank pre{white-space:pre-wrap;font:inherit;margin:6px 0 10px}
.empty{text-align:center;color:var(--muted);padding:20px}
</style>
</head>
<body>
<header>
  <div style="max-width:1000px;margin:0 auto"><h1>🤾 Pedidos Handball</h1></div>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-v="order" aria-selected="true">Pedido</button>
    <button class="tab" role="tab" data-v="list" aria-selected="false">Pedidos <span id="cnt"></span></button>
    <button class="tab" role="tab" data-v="set" aria-selected="false">Ajustes</button>
  </div>
</header>
<main>
  <section id="v-order" class="layout">
    <div id="menus"></div>
    <aside class="card" id="cart"></aside>
  </section>
  <section id="v-list" hidden></section>
  <section id="v-set" hidden></section>
</main>

<script>
(function(){
  var KEY='pedidos-handball-v1';
  var S={menus:[
    {id:'m1',name:'Menú 1',desc:'Hamburguesa + bebida',price:4500,promo:false},
    {id:'m2',name:'Menú 2',desc:'Completo + bebida',price:3500,promo:true}],orders:[],next:1};
  try{var r=localStorage.getItem(KEY);if(r){var o=JSON.parse(r);if(o&&o.menus&&o.orders)S=o}}catch(e){}
  S.bank=S.bank||'';var cart={},pay='Efectivo',view='order',ref='',phone='';
  var $=function(i){return document.getElementById(i)};
  var save=function(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
  var money=function(x){return '$'+Math.round(x).toLocaleString('es-CL')};
  var esc=function(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};

  function calc(){
    var lines=[],sub=0,disc=0;
    S.menus.forEach(function(m){
      var q=cart[m.id]||0;if(!q)return;
      var free=m.promo?Math.floor(q/2):0;
      sub+=q*m.price;disc+=free*m.price;
      lines.push({name:m.name,qty:q,price:m.price,free:free});
    });
    return {lines:lines,sub:sub,disc:disc,total:sub-disc};
  }

  function renderMenus(){
    $('menus').innerHTML=S.menus.map(function(m){
      return '<div class="card menu"><div><h3>'+esc(m.name)+(m.promo?'<span class="badge">2x1</span>':'')+'</h3><p>'+esc(m.desc)+'</p><div class="price">'+money(m.price)+(m.promo?' · lleva 2, paga 1':'')+'</div></div>'+
      '<div class="stepper"><button data-a="-" data-id="'+m.id+'" aria-label="Quitar '+esc(m.name)+'">−</button><b>'+(cart[m.id]||0)+'</b><button data-a="+" data-id="'+m.id+'" aria-label="Agregar '+esc(m.name)+'">+</button></div></div>';
    }).join('');
  }

  function renderCart(keepFocus){
    var c=calc(),nm=$('cname')?$('cname').value:'';
    var h='<h2 style="margin:0 0 10px;font-size:1.5rem">Resumen</h2>';
    h+='<label for="cname">Nombre o N° de mesa (opcional)</label><input type="text" id="cname" maxlength="40" value="'+esc(nm)+'">';
    h+='<label for="cphone" style="margin-top:12px">WhatsApp del cliente (opcional)</label><input type="text" id="cphone" inputmode="tel" maxlength="20" placeholder="9 1234 5678" value="'+esc(phone)+'">';
    h+='<label style="margin-top:12px">Forma de pago</label><div class="chips">'+['Efectivo','Transferencia','Tarjeta'].map(function(p){return '<button class="chip" data-pay="'+p+'" aria-pressed="'+(p===pay)+'">'+p+'</button>'}).join('')+'</div>';
    if(pay==='Transferencia'){
      h+='<div class="bank"><b>Datos para transferir</b>'+(S.bank?'<pre>'+esc(S.bank)+'</pre><button class="ghost" id="copybank">Copiar datos</button>':'<p class="empty" style="padding:6px 0;text-align:left">Agrega los datos de la cuenta en Ajustes.</p>')+'<label for="cref" style="margin-top:10px">N° de comprobante (opcional)</label><input type="text" id="cref" maxlength="30" value="'+esc(ref)+'"></div>';
    }
    if(!c.lines.length)h+='<p class="empty" style="padding:8px">Agrega menús para ver el total.</p>';
    c.lines.forEach(function(l){
      h+='<div class="line"><span>'+l.qty+'× '+esc(l.name)+'</span><span>'+money(l.qty*l.price)+'</span></div>';
      if(l.free)h+='<div class="line disc"><span>Promo 2x1 ('+l.free+' gratis)</span><span>−'+money(l.free*l.price)+'</span></div>';
    });
    h+='<div class="line total"><span>Total</span><span>'+money(c.total)+'</span></div>';
    h+='<button class="cta" id="confirm"'+(c.lines.length?'':' disabled')+'>Confirmar pedido</button>';
    $('cart').innerHTML=h;
    if(keepFocus){var el=$('cname');if(el){el.focus();el.setSelectionRange(nm.length,nm.length)}}
  }

  function renderList(){
    var os=S.orders,tot=0,pend=0,units={},saved=0,tr=0;
    os.forEach(function(o){tot+=o.total;saved+=o.disc;if(o.pay==='Transferencia')tr+=o.total;if(o.status==='p')pend++;o.items.forEach(function(i){units[i.name]=(units[i.name]||0)+i.qty})});
    var h='<div class="stats"><div class="stat"><div class="big">'+os.length+'</div><span>pedidos</span></div><div class="stat"><div class="big">'+money(tot)+'</div><span>ventas</span></div><div class="stat"><div class="big">'+money(tr)+'</div><span>por transferencia</span></div><div class="stat"><div class="big">'+pend+'</div><span>pendientes de entrega</span></div><div class="stat"><div class="big">'+money(saved)+'</div><span>descontado por 2x1</span></div></div>';
    var us=Object.keys(units);
    if(us.length)h+='<div class="card"><b>Unidades vendidas:</b> '+us.map(function(k){return esc(k)+' '+units[k]}).join(' · ')+'</div>';
    h+='<div class="row"><button class="ghost" id="csv">Exportar a Excel (CSV)</button><button class="ghost" id="clear">Cerrar día y borrar pedidos</button></div>';
    if(!os.length)h+='<p class="empty">Aún no hay pedidos.</p>';
    os.slice().reverse().forEach(function(o){
      var t=new Date(o.t).toLocaleTimeString('es-CL',{hour:'2-digit',minute:'2-digit'});
      h+='<div class="card ord"><div><h3>#'+o.n+(o.name?' · '+esc(o.name):'')+'</h3><small>'+t+' · '+esc(o.pay)+(o.ref?' · Comprobante '+esc(o.ref):'')+'</small><div>'+o.items.map(function(i){return i.qty+'× '+esc(i.name)}).join(', ')+'</div></div><div style="text-align:right"><div class="big" style="font-size:1.6rem">'+money(o.total)+'</div><button class="ghost" data-wa="'+o.n+'" style="padding:6px 10px">WhatsApp</button> <button class="st '+o.status+'" data-n="'+o.n+'">'+(o.status==='p'?'Pendiente':'Entregado ✓')+'</button> <button class="del" data-del="'+o.n+'" aria-label="Eliminar pedido">×</button></div></div>';
    });
    $('v-list').innerHTML=h;
  }

  function renderSet(){
    var h='<div class="card"><h2 style="margin:0 0 4px">Datos para transferencia</h2><label for="bank">Aparecen al elegir &quot;Transferencia&quot; (nombre, RUT, banco, tipo y N° de cuenta, correo)</label><textarea id="bank" rows="5" style="width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px">'+esc(S.bank)+'</textarea></div><div class="card"><h2 style="margin:0 0 4px">Menús y promoción</h2><p class="empty" style="padding:0 0 12px;text-align:left">Cambia nombres, detalle y precios. Marca 2x1 en el menú que tiene la promoción.</p>';
    S.menus.forEach(function(m,i){
      h+='<div class="set"><div><label>Nombre</label><input type="text" data-i="'+i+'" data-k="name" value="'+esc(m.name)+'"></div><div><label>Precio ($)</label><input type="number" inputmode="numeric" min="0" data-i="'+i+'" data-k="price" value="'+m.price+'"></div><div class="full"><label>Detalle</label><input type="text" data-i="'+i+'" data-k="desc" value="'+esc(m.desc)+'"></div><div class="full"><label style="display:flex;gap:8px;align-items:center;color:var(--ink)"><input type="checkbox" data-i="'+i+'" data-k="promo"'+(m.promo?' checked':'')+'> Promoción 2x1 en este menú</label></div></div>';
    });
    $('v-set').innerHTML=h+'</div>';
  }

  function show(v){
    view=v;
    ['order','list','set'].forEach(function(k){$('v-'+k).hidden=k!==v});
    Array.prototype.forEach.call(document.querySelectorAll('.tab'),function(t){t.setAttribute('aria-selected',t.dataset.v===v)});
    if(v==='list')renderList();if(v==='set')renderSet();
  }
  function count(){var p=S.orders.filter(function(o){return o.status==='p'}).length;$('cnt').textContent=p?'('+p+')':''}

  document.addEventListener('click',function(e){
    var b=e.target.closest('button');if(!b)return;
    if(b.dataset.v)return show(b.dataset.v);
    if(b.dataset.a){var id=b.dataset.id,q=cart[id]||0;cart[id]=Math.max(0,q+(b.dataset.a==='+'?1:-1));renderMenus();return renderCart(false)}
    if(b.dataset.pay){pay=b.dataset.pay;return renderCart(false)}
    if(b.id==='confirm'){
      var c=calc();if(!c.lines.length)return;
      S.orders.push({n:S.next++,name:$('cname').value.trim(),pay:pay,ref:pay==='Transferencia'?ref:'',phone:phone,t:Date.now(),status:'p',total:c.total,disc:c.disc,items:c.lines.map(function(l){return {name:l.name,qty:l.qty}})});
      save();cart={};ref='';phone='';$('cname').value='';renderMenus();renderCart(false);count();
      b.textContent='¡Pedido #'+(S.next-1)+' guardado!';return;
    }
    if(b.dataset.n){var o=S.orders.filter(function(x){return x.n==b.dataset.n})[0];o.status=o.status==='p'?'d':'p';save();renderList();return count()}
    if(b.dataset.wa){
      var wo=S.orders.filter(function(x){return x.n==b.dataset.wa})[0];if(!wo)return;
      var wt='🤾 *Pedido #'+wo.n+'*'+(wo.name?' · '+wo.name:'')+'\n';
      wo.items.forEach(function(i){wt+=i.qty+'× '+i.name+'\n'});
      if(wo.disc)wt+='Promo 2x1: −'+money(wo.disc)+'\n';
      wt+='*Total: '+money(wo.total)+'*\nPago: '+wo.pay+(wo.ref?' (comprobante '+wo.ref+')':'');
      if(wo.pay==='Transferencia'&&S.bank&&!wo.ref)wt+='\n\nDatos para transferir:\n'+S.bank;
      wt+=wo.status==='d'?'\n\n¡Tu pedido está listo! 🙌':'\n\nTu pedido está en preparación.';
      var wp=(wo.phone||'').replace(/\D/g,'');if(wp.length===9&&wp[0]==='9')wp='56'+wp;
      var wl=document.createElement('a');wl.href='https://wa.me/'+wp+'?text='+encodeURIComponent(wt);wl.target='_blank';wl.rel='noopener';document.body.appendChild(wl);wl.click();wl.remove();return
    }
    if(b.dataset.del){if(confirm('¿Eliminar este pedido?')){S.orders=S.orders.filter(function(x){return x.n!=b.dataset.del});save();renderList();count()}return}
    if(b.id==='clear'){if(confirm('¿Cerrar el día y borrar todos los pedidos? Exporta antes si necesitas el registro.')){S.orders=[];S.next=1;save();renderList();count()}return}
    if(b.id==='copybank'){if(navigator.clipboard)navigator.clipboard.writeText(S.bank).then(function(){b.textContent='¡Copiado!'}).catch(function(){});return}
    if(b.id==='csv'){
      var rows=[['N°','Hora','Cliente','Detalle','Pago','WhatsApp','N° comprobante','Descuento 2x1','Total','Estado']];
      S.orders.forEach(function(o){rows.push([o.n,new Date(o.t).toLocaleTimeString('es-CL'),o.name,o.items.map(function(i){return i.qty+'x '+i.name}).join(' + '),o.pay,o.phone||'',o.ref||'',o.disc,o.total,o.status==='p'?'Pendiente':'Entregado'])});
      var csv='\uFEFF'+rows.map(function(r){return r.map(function(x){return '"'+String(x).replace(/"/g,'""')+'"'}).join(';')}).join('\r\n');
      var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='pedidos-handball.csv';document.body.appendChild(a);a.click();a.remove();
    }
  });
  document.addEventListener('input',function(e){
    var t=e.target;
    if(t.id==='cname'){var cb=$('confirm');if(cb&&cb.textContent!=='Confirmar pedido')cb.textContent='Confirmar pedido';return}
    if(t.id==='cphone'){phone=t.value;return}
    if(t.id==='cref'){ref=t.value;return}
    if(t.id==='bank'){S.bank=t.value;save();return}
    if(t.dataset&&t.dataset.k){
      var m=S.menus[+t.dataset.i],k=t.dataset.k;
      m[k]=k==='promo'?t.checked:(k==='price'?Math.max(0,+t.value||0):t.value);
      save();renderMenus();renderCart(false);
    }
  });

  renderMenus();renderCart(false);count();
})();
</script>
</body>
</html>
